[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuoyan-skill-v2"
version = "2.2.1"
description = "诺研_skill — IVD研发项目调研证据采集、报告和审阅表生成工具"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pydantic",
    "jinja2",
    "openpyxl",
    "beautifulsoup4",
    "lxml",
    "httpx",
]

[project.scripts]
nuoyan = "ivd_research.cli:main"

[project.optional-dependencies]
pdf = [
    "pypdf",
    "pdfplumber",
]
browser = [
    "playwright",
]
ocr = [
    "pillow",
    "pytesseract",
]
translation = [
    "argostranslate",
]
dev = [
    "pytest",
    "ruff==0.15.17",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools.package-data]
ivd_research = [
    "assets/styles/*.css",
    "assets/templates/*",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
markers = [
    "live_network: opt-in acceptance tests that call real public network sources",
]
