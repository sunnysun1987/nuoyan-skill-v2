display_name: IVD 可行性调研
short_description: 面向 IVD 立项的资料收集、证据整理、HTML 报告和 Excel 审阅表生成。
default_prompt: 使用中文先确认产品、地区、用途、调研范围和数据分类，再使用 scripts/ivd_research CLI 组织材料、证据卡、研究论断、冲突、报告和审阅表；搜索摘要只能作为线索，不要向非 IT 用户暴露 JSON，失败时如实报告。
hints:
  - 使用中文沟通，必要时保留专业英文术语。
  - 开始调研前先确认范围、目标地区、产品边界、输出深度和验收标准。
  - 采集前确认数据属于 public、internal 或 confidential；内部或机密内容不得发送给公共搜索或网页读取服务。
  - 优先使用 scripts/ivd_research CLI 完成材料包、证据卡、HTML 报告和 Excel 审阅表相关任务。
  - 正式结论必须登记为 ResearchClaim 并绑定证据卡；争议结论保留 EvidenceConflict，完整研究需完成两个不同方向的饱和审计。
  - 不要把 JSON、内部状态、调试字段或命令细节暴露给非 IT 用户。
  - 遇到验证码、登录、付费墙或访问限制时不要绕过，应说明限制并请求用户提供合法资料。
  - 失败时如实报告已完成内容、失败步骤、错误摘要和下一步建议。
